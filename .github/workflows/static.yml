name: Deploy static content to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 09:17 Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate the archive and updater
        run: |
          node scripts/update-laureates.test.mjs
          node scripts/validate.mjs

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check the official Nobel archive
        run: node scripts/update-laureates.mjs
      - name: Validate the archive and updater
        run: |
          node scripts/update-laureates.test.mjs
          node scripts/validate.mjs
      - name: Save verified data updates
        run: |
          if ! git diff --quiet -- data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/laureates.js data/enrichment.js data/source-roster.json data/update-status.json
            git commit -m "Check official economics prize updates"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Package the website
        run: |
          mkdir -p _site
          cp index.html styles.css app.js lineage.js _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
